<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekip Otofaji & Ketozis Canlı Takip Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #070a12;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .wrapper {
            background-color: #0f172a;
            padding: 1.5rem;
            border-radius: 1.2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-width: 1000px;
            width: 100%;
            border: 1px solid #1e293b;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        h1 {
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 0.2rem 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            font-weight: 800;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .team-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .member-card {
            background-color: #1a2234;
            border: 1.5px solid #334155;
            border-radius: 0.8rem;
            padding: 1rem 1.2rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .member-card.glow {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
            background: linear-gradient(135deg, #1a2234 0%, #0f172a 100%);
        }

        /* Elenen Üye Stili */
        .member-card.eliminated {
            border-color: #ef4444;
            opacity: 0.55;
            background: linear-gradient(135deg, #2a1a1a 0%, #0f172a 100%);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .member-name-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .member-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .member-stats {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .member-timer {
            font-size: 1.15rem;
            font-weight: 800;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.5px;
        }
        .member-timer.eliminated-timer {
            color: #ef4444;
        }
        .level-badge {
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }
        .level-badge.eliminated-badge {
            background-color: #ef4444 !important;
            color: #ffffff;
        }

        .progress-box {
            position: relative;
            margin: 0.6rem 0 0.4rem 0;
        }
        .progress-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #090d16;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1.5px solid #334155;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e 0%, #38bdf8 40%, #eab308 70%, #a855f7 100%);
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            transition: width 0.3s ease;
        }
        .progress-bar-fill.eliminated-fill {
            background: #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        .milestone-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .m-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .markers-container {
            position: relative;
            height: 18px;
            margin-top: 0.4rem;
        }
        .marker {
            position: absolute;
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 800;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        .marker.passed {
            color: #22c55e;
            text-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
        }
        .marker.key-spot {
            color: #eab308;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
        }

        .reference-section {
            background-color: #162032;
            border-radius: 0.8rem;
            padding: 1.2rem;
            border: 1px solid #1e293b;
        }
        .reference-title {
            font-size: 1rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.8rem;
        }
        .stage-ref-card {
            background-color: #0f172a;
            border-left: 3.5px solid #38bdf8;
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.8rem;
        }
        .ref-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .ref-level {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            color: #000;
        }
        .ref-hours {
            font-size: 0.72rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .ref-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.3rem;
        }
        .ref-desc {
            font-size: 0.75rem;
            color: #cbd5e1;
            line-height: 1.3;
        }
        
        .active-dot {
            height: 7px;
            width: 7px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #38bdf8;
            animation: pulse-dot 1s infinite alternate;
        }
        .active-dot.eliminated-dot {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
            animation: none;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>Ekip Otofaji & Ketozis Canlı Takip Paneli</h1>
        <div class="subtitle">Literatürdeki Altın Standart Açlık Sürelerine Göre Biyolojik Takip</div>
    </div>

    <div id="team-list" class="team-container"></div>

    <div class="reference-section">
        <div class="reference-title">🔬 Literatür Tabanlı Biyolojik Evreler Rehberi</div>
        <div id="reference-grid" class="stages-grid"></div>
    </div>
</div>

<script>
    const team = [
        { name: "Özer", startStr: "2026-09-06T18:00:00", eliminated: false },
        { name: "İrem", startStr: "2026-09-06T23:00:00", eliminated: false },
        { name: "Akın", startStr: "2026-09-08T00:00:00", eliminated: false },
        { name: "Erhan", startStr: "2026-09-08T01:18:00", eliminated: false },
        { name: "Gül", startStr: "2026-09-08T18:30:00", eliminated: false },
        { name: "Hacı", startStr: "2026-09-08T20:00:00", eliminated: false },
        { name: "Berkay", startStr: "2026-09-08T21:00:00", eliminated: true }, // Elendi
        { name: "Ertuğrul", startStr: "2026-09-09T09:10:00", eliminated: false }
    ];

    const metabolicStages = [
        { level: "FAZ 1", color: "#64748b", min: 0, max: 12, title: "🚀 Anabolik & Sindirim", desc: "Besin emilimi devam eder, kan şekeri ve insülin yüksek seyreder." },
        { level: "FAZ 2", color: "#eab308", min: 12, max: 24, title: "🔥 Lipoliz & Glikojen Sonu", desc: "Karaciğer glikojeni biter. İnsülin dip yapar, yağ yakımı (lipoliz) tetiklenir." },
        { level: "FAZ 3", color: "#38bdf8", min: 24, max: 48, title: "⚡ Ketozis & Otofaji Uyarımı", desc: "AMPK aktivasyonu ile hücresel süpürgeler devreye girer, beyin ketona adapte olur." },
        { level: "FAZ 4", color: "#818cf8", min: 48, max: 72, title: "🛡️ Derin Otofaji & HGH Zirvesi", desc: "Otofajik temizlik ve kas koruyucu Büyüme Hormonu (HGH) en yüksek seviyelerine ulaşır." },
        { level: "FAZ 5", color: "#a855f7", min: 72, max: 162, title: "👑 İmmün Reset & Plato Evresi", desc: "Sweet Spot! Bağışıklık hücreleri yenilenir. 72s sonrasında otofajik temizlik platoda sürdürülür." }
    ];

    const keyMilestones = [
        { hours: 0, pct: 0, label: "0s" },
        { hours: 12, pct: 12, label: "12s" },
        { hours: 24, pct: 25, label: "24s (Ketozis)" },
        { hours: 48, pct: 50, label: "48s (Derin Otofaji)" },
        { hours: 72, pct: 75, label: "72s (Sweet Spot)" },
        { hours: 162, pct: 100, label: "162s (Final)" }
    ];

    function getStageInfo(hours) {
        for (let stage of metabolicStages) {
            if (hours >= stage.min && hours < stage.max) {
                return stage;
            }
        }
        if (hours >= 162) {
            return { level: "VICTORY", color: "#eab308", title: "🎉 HEDEFE ULAŞILDI!", desc: "162 saatlik tam süreç tamamlandı." };
        }
        return { level: "READY", color: "#64748b", title: "Beklemede", desc: "Oruç henüz başlamadı." };
    }

    function calculateBarPercentage(hours) {
        if (hours <= 0) return 0;
        if (hours >= 162) return 100;

        for (let i = 0; i < keyMilestones.length - 1; i++) {
            const m1 = keyMilestones[i];
            const m2 = keyMilestones[i + 1];
            if (hours >= m1.hours && hours <= m2.hours) {
                const ratio = (hours - m1.hours) / (m2.hours - m1.hours);
                return m1.pct + (ratio * (m2.pct - m1.pct));
            }
        }
        return 0;
    }

    function initUI() {
        const teamContainer = document.getElementById("team-list");
        teamContainer.innerHTML = "";

        team.forEach((member, index) => {
            const cardHtml = `
                <div class="member-card ${member.eliminated ? 'eliminated' : 'glow'}" id="card-${index}">
                    <div class="member-header">
                        <div class="member-name-box">
                            <span class="active-dot ${member.eliminated ? 'eliminated-dot' : ''}"></span>
                            <span class="member-name">${member.name} ${member.eliminated ? '🍿' : ''}</span>
                        </div>
                        <div class="member-stats">
                            <div class="member-timer ${member.eliminated ? 'eliminated-timer' : ''}" id="timer-${index}">00g 00s 00d 00s</div>
                            <div class="level-badge ${member.eliminated ? 'eliminated-badge' : ''}" id="level-badge-${index}">FAZ 1</div>
                        </div>
                    </div>

                    <div class="progress-box">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${member.eliminated ? 'eliminated-fill' : ''}" id="bar-${index}"></div>
                            <div class="milestone-lines">
                                ${keyMilestones.map(m => `<div class="m-line" style="left: ${m.pct}%"></div>`).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="markers-container">
                        ${keyMilestones.map(m => `
                            <span class="marker ${m.hours === 72 ? 'key-spot' : ''}" id="m-${index}-${m.hours}" style="left: ${m.pct}%">
                                ${m.label}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
            teamContainer.innerHTML += cardHtml;
        });

        const refGrid = document.getElementById("reference-grid");
        refGrid.innerHTML = "";
        metabolicStages.forEach(stg => {
            const refHtml = `
                <div class="stage-ref-card" style="border-left-color: ${stg.color}">
                    <div class="ref-card-header">
                        <span class="ref-level" style="background-color: ${stg.color}">${stg.level}</span>
                        <span class="ref-hours">${stg.min} - ${stg.max}. Saat</span>
                    </div>
                    <div class="ref-title">${stg.title}</div>
                    <div class="ref-desc">${stg.desc}</div>
                </div>
            `;
            refGrid.innerHTML += refHtml;
        });
    }

    function updateDashboard() {
        const now = new Date();

        team.forEach((member, index) => {
            if (member.eliminated) {
                document.getElementById(`timer-${index}`).innerText = "Diskalifiye";
                document.getElementById(`bar-${index}`).style.width = "100%";
                document.getElementById(`level-badge-${index}`).innerText = "ELENDİ";
                return;
            }

            const startDate = new Date(member.startStr);
            const elapsedMs = now - startDate;

            if (elapsedMs < 0) {
                document.getElementById(`timer-${index}`).innerText = "Başlamadı";
                return;
            }

            const elapsedSeconds = Math.floor((elapsedMs / 1000) % 60);
            const elapsedMinutes = Math.floor((elapsedMs / (1000 * 60)) % 60);
            const elapsedHoursTotal = Math.floor(elapsedMs / (1000 * 60 * 60));
            const elapsedDays = Math.floor(elapsedHoursTotal / 24);
            const elapsedHours = elapsedHoursTotal % 24;

            const pad = (num) => String(num).padStart(2, '0');
            document.getElementById(`timer-${index}`).innerText = `${elapsedDays}g ${pad(elapsedHours)}s ${pad(elapsedMinutes)}d ${pad(elapsedSeconds)}s`;

            const totalHoursExact = elapsedMs / (1000 * 60 * 60);

            // Progress Bar
            const pct = calculateBarPercentage(totalHoursExact);
            document.getElementById(`bar-${index}`).style.width = `${pct}%`;

            // Rozet
            const stageInfo = getStageInfo(totalHoursExact);
            const badgeElem = document.getElementById(`level-badge-${index}`);
            badgeElem.innerText = `${stageInfo.level} (${totalHoursExact.toFixed(1)}s)`;
            badgeElem.style.backgroundColor = stageInfo.color;

            // Marker İşaretçileri
            keyMilestones.forEach(m => {
                const markerElem = document.getElementById(`m-${index}-${m.hours}`);
                if (markerElem) {
                    markerElem.classList.remove("passed");
                    if (totalHoursExact >= m.hours) {
                        markerElem.classList.add("passed");
                    }
                }
            });
        });
    }

    initUI();
    setInterval(updateDashboard, 1000);
    updateDashboard();
</script>

</body>
</html>
