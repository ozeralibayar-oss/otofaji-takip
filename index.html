<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometrics // Autophagy Live Matrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030712;
            --card-bg: rgba(17, 24, 39, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --neon-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: var(--neon-blue);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
        }

        .team-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(56, 189, 248, 0.15);
        }

        .card.eliminated {
            opacity: 0.7;
            border-color: rgba(239, 68, 68, 0.4);
            background: rgba(30, 15, 20, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .user-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .timer-badge-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-blue);
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .timer.eliminated-timer {
            color: var(--neon-red);
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            font-size: 1rem;
        }

        .phase-badge {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #030712;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .phase-badge.eliminated-badge {
            background-color: var(--neon-red) !important;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .progress-wrapper {
            position: relative;
            margin-bottom: 0.6rem;
        }

        .progress-track {
            width: 100%;
            height: 14px;
            background: rgba(3, 7, 18, 0.8);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            border-radius: 9999px;
            position: relative;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .progress-fill.eliminated-fill {
            background: var(--neon-red) !important;
            box-shadow: 0 0 15px var(--neon-red);
        }

        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .grid-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .milestones {
            position: relative;
            height: 16px;
        }

        .ms-item {
            position: absolute;
            font-size: 0.68rem;
            font-weight: 700;
            color: #475569;
            transform: translateX(-50%);
            transition: color 0.3s ease;
        }

        .ms-item.passed {
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }

        .ref-section {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .ref-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .ref-card {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            border-top: 3px solid var(--neon-blue);
        }

        .ref-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .ref-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            color: #000;
        }

        .ref-time {
            font-size: 0.72rem;
            color: #64748b;
            font-weight: 700;
        }

        .ref-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.2rem;
        }

        .ref-desc {
            font-size: 0.73rem;
            color: #94a3b8;
            line-height: 1.35;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Fotoğraf Pop-up Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1rem;
        }

        .modal img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 16px;
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }

        .modal-caption {
            margin-top: 1rem;
            color: #f8fafc;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal-close {
            margin-top: 1rem;
            padding: 6px 16px;
            background: var(--neon-red);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-badge">
            <span class="pulse-dot"></span> Live Biometric Feed
        </div>
        <h1>Otofaji & Ketozis Matrisi</h1>
        <div class="subtitle">Metabolik Aşamalar ve Canlı Hücresel Yenilenme Paneli</div>
    </div>

    <div id="team-list" class="team-grid"></div>

    <div class="ref-section">
        <div class="ref-header">
            ⚡ Metabolik Evreler ve Biyolojik Karşılıkları
        </div>
        <div id="ref-grid" class="ref-grid"></div>
    </div>
</div>

<!-- Modal kanıt ekranı -->
<div class="modal" id="proof-modal">
    <img id="proof-img" src="" alt="Kanıt">
    <div class="modal-caption">⚠️ Kanıtlanan Yemek Yeme Anı (Diskalifiye)</div>
    <button class="modal-close" onclick="closeModal()">Kapat</button>
</div>

<script>
    const team = [
        { name: "Özer", startStr: "2026-09-06T18:00:00", eliminated: false },
        { name: "İrem", startStr: "2026-09-06T23:00:00", eliminated: false },
        { name: "Akın", startStr: "2026-09-08T00:00:00", eliminated: false },
        { name: "Erhan", startStr: "2026-09-08T01:18:00", eliminated: false },
        { name: "Gül", startStr: "2026-09-08T18:30:00", eliminated: false },
        { name: "Hacı", startStr: "2026-09-08T20:00:00", eliminated: false },
        { name: "Berkay", startStr: "2026-09-08T21:00:00", eliminated: true, img: "berkay.jpg" },
        { name: "Ertuğrul", startStr: "2026-09-09T09:10:00", eliminated: false }
    ];

    const stages = [
        { level: "FAZ 1", color: "#64748b", min: 0, max: 12, title: "Anabolik & Sindirim", desc: "Besin emilimi aktif. Glikojen depoları kullanıma hazırlanıyor." },
        { level: "FAZ 2", color: "#f59e0b", min: 12, max: 24, title: "Lipoliz Aktivasyonu", desc: "Glikojen bitti. İnsülin dip seviyede, yağ yakımı başladı." },
        { level: "FAZ 3", color: "#38bdf8", min: 24, max: 48, title: "Ketozis & Otofaji", desc: "AMPK tetiklendi. Bozuk proteinler temizleniyor, beyin ketona geçti." },
        { level: "FAZ 4", color: "#818cf8", min: 48, max: 72, title: "Derin Tamirat & HGH Zirvesi", desc: "Otofajik temizlik maksimumda. Büyüme hormonu kasları koruyor." },
        { level: "FAZ 5", color: "#c084fc", min: 72, max: 162, title: "İmmün Reset & Plato", desc: "Kök hücre aktivasyonu ile bağışıklık yenileniyor." }
    ];

    const milestones = [
        { hours: 0, pct: 0, label: "0s" },
        { hours: 12, pct: 12, label: "12s" },
        { hours: 24, pct: 25, label: "24s" },
        { hours: 48, pct: 50, label: "48s" },
        { hours: 72, pct: 75, label: "72s" },
        { hours: 162, pct: 100, label: "162s" }
    ];

    function openModal(imgUrl) {
        document.getElementById('proof-img').src = imgUrl;
        document.getElementById('proof-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('proof-modal').style.display = 'none';
    }

    function getStage(hours) {
        for (let s of stages) {
            if (hours >= s.min && hours < s.max) return s;
        }
        return hours >= 162 
            ? { level: "VICTORY", color: "#f59e0b", title: "Şampiyonluk", desc: "Süreç tamamlandı!" }
            : { level: "WAITING", color: "#64748b", title: "Beklemede", desc: "Henüz başlamadı." };
    }

    function getPct(hours) {
        if (hours <= 0) return 0;
        if (hours >= 162) return 100;
        for (let i = 0; i < milestones.length - 1; i++) {
            let m1 = milestones[i], m2 = milestones[i+1];
            if (hours >= m1.hours && hours <= m2.hours) {
                return m1.pct + ((hours - m1.hours) / (m2.hours - m1.hours)) * (m2.pct - m1.pct);
            }
        }
        return 0;
    }

    function init() {
        const teamContainer = document.getElementById("team-list");
        teamContainer.innerHTML = team.map((m, i) => `
            <div class="card ${m.eliminated ? 'eliminated' : ''}">
                <div class="card-header">
                    <div class="user-info">
                        <div class="avatar">
                            ${m.img 
                                ? `<img src="${m.img}" onclick="openModal('${m.img}')" title="Kanıtı gör">` 
                                : m.name[0]}
                        </div>
                        <div class="user-name">${m.name} ${m.eliminated ? '🍿' : ''}</div>
                    </div>
                    <div class="timer-badge-group">
                        <div class="timer ${m.eliminated ? 'eliminated-timer' : ''}" id="timer-${i}">00d 00h 00m</div>
                        <div class="phase-badge ${m.eliminated ? 'eliminated-badge' : ''}" id="badge-${i}">FAZ 1</div>
                    </div>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-track">
                        <div class="progress-fill ${m.eliminated ? 'eliminated-fill' : ''}" id="bar-${i}"></div>
                        <div class="grid-lines">
                            ${milestones.map(ms => `<div class="grid-dot" style="left: ${ms.pct}%"></div>`).join('')}
                        </div>
                    </div>
                </div>
                <div class="milestones">
                    ${milestones.map(ms => `<span class="ms-item" id="ms-${i}-${ms.hours}" style="left: ${ms.pct}%">${ms.label}</span>`).join('')}
                </div>
            </div>
        `).join('');

        const refGrid = document.getElementById("ref-grid");
        refGrid.innerHTML = stages.map(s => `
            <div class="ref-card" style="border-top-color: ${s.color}">
                <div class="ref-card-head">
                    <span class="ref-badge" style="background:${s.color}">${s.level}</span>
                    <span class="ref-time">${s.min}-${s.max} Saat</span>
                </div>
                <div class="ref-title">${s.title}</div>
                <div class="ref-desc">${s.desc}</div>
            </div>
        `).join('');
    }

    function update() {
        const now = new Date();
        team.forEach((m, i) => {
            if (m.eliminated) {
                document.getElementById(`timer-${i}`).innerText = "DISQUALIFIED";
                document.getElementById(`bar-${i}`).style.width = "100%";
                document.getElementById(`badge-${i}`).innerText = "ELENDİ";
                return;
            }

            const elapsed = now - new Date(m.startStr);
            if (elapsed < 0) return;

            const totalHours = elapsed / (1000 * 60 * 60);
            const days = Math.floor(totalHours / 24);
            const hours = Math.floor(totalHours % 24);
            const mins = Math.floor((elapsed / (1000 * 60)) % 60);

            const pad = n => String(n).padStart(2, '0');
            document.getElementById(`timer-${i}`).innerText = `${days}d ${pad(hours)}h ${pad(mins)}m`;

            const pct = getPct(totalHours);
            document.getElementById(`bar-${i}`).style.width = `${pct}%`;

            const stage = getStage(totalHours);
            const badge = document.getElementById(`badge-${i}`);
            badge.innerText = `${stage.level} (${totalHours.toFixed(1)}s)`;
            badge.style.backgroundColor = stage.color;

            milestones.forEach(ms => {
                const elem = document.getElementById(`ms-${i}-${ms.hours}`);
                if (elem) {
                    if (totalHours >= ms.hours) elem.classList.add('passed');
                    else elem.classList.remove('passed');
                }
            });
        });
    }

    init();
    setInterval(update, 1000);
    update();
</script>

</body>
</html>
